title: Cloud Credentials and API Secret Leakage in AI Prompts
id: f6a7b8c9-d0e1-2f3a-4b5c-6d7e8f9a0b1c
status: experimental
description: Detects accidental submission of AWS access keys, GitHub personal access tokens, or private SSH/RSA keys inside AI gateway requests.
references:
  - https://atlas.mitre.org/techniques/AML.T0048/
  - https://owasp.org/www-project-top-10-for-large-language-model-applications/assets/NIST_AI_RMF_OWASP_LLM_Top_10.pdf
author: Bhavithra SR
date: 2026/09/30
tags:
  - attack.credential_access
  - attack.exfiltration
  - owasp.llm02
  - mitre.atlas.aml.t0048
logsource:
  category: application
  product: litellm_ai_gateway
detection:
  selection_rule:
    security.rule_name: 'SECRET_LEAKAGE'
  selection_patterns:
    ai.prompt_text|re:
      - '\bAKIA[0-9A-Z]{16}\b'
      - '\bghp_[0-9a-zA-Z]{36}\b'
  selection_private_keys:
    ai.prompt_text|contains:
      - '-----BEGIN PRIVATE KEY-----'
      - '-----BEGIN OPENSSH PRIVATE KEY-----'
      - '-----BEGIN RSA PRIVATE KEY-----'
  condition: selection_rule or selection_patterns or selection_private_keys
falsepositives:
  - Synthetic dummy mock credentials in documentation reviews
level: critical
