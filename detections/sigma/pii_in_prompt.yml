title: AI Prompt PII Leakage Detection
id: a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
status: experimental
description: Detects potential credit card numbers, Social Security Numbers (SSN), or national identity identifiers submitted in AI gateway prompts.
references:
  - https://owasp.org/www-project-top-10-for-large-language-model-applications/assets/NIST_AI_RMF_OWASP_LLM_Top_10.pdf
  - https://atlas.mitre.org/techniques/AML.T0024/
author: Bhavithra SR
date: 2026/09/30
tags:
  - attack.exfiltration
  - attack.initial_access
  - owasp.llm02
  - mitre.atlas.aml.t0024
logsource:
  category: application
  product: litellm_ai_gateway
detection:
  selection_rule:
    security.rule_name: 'PII_IN_PROMPT'
  selection_regex:
    ai.prompt_text|re:
      - '\b(?:4[0-9]{12}(?:[0-9]{3})?|5[1-5][0-9]{14}|3[47][0-9]{13})\b'
      - '\b[0-9]{3}-[0-9]{2}-[0-9]{4}\b'
  condition: selection_rule or selection_regex
falsepositives:
  - Synthetic test data or QA test suites running with mock card numbers
level: high
