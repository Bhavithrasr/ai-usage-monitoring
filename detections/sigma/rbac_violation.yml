title: AI Gateway Role-Based Access Control Violation
id: c3d4e5f6-a7b8-9c0d-1e2f-3a4b5c6d7e8f
status: experimental
description: Detects unauthorized attempts by a user to query an AI model outside their designated departmental role (e.g. HR querying Dev Code models).
references:
  - https://atlas.mitre.org/techniques/AML.T0012/
  - https://atlas.mitre.org/techniques/AML.T0016/
author: Bhavithra SR
date: 2026/09/30
tags:
  - attack.privilege_escalation
  - attack.defense_evasion
  - owasp.llm06
  - mitre.atlas.aml.t0012
  - mitre.atlas.aml.t0016
logsource:
  category: application
  product: litellm_ai_gateway
detection:
  selection_403:
    ai.status_code: 403
  selection_hr_violation:
    user.role: 'role_hr'
    ai.model:
      - 'dev-code-llm'
      - 'financial-analyzer-llm'
  selection_finance_violation:
    user.role: 'role_finance'
    ai.model: 'dev-code-llm'
  condition: selection_403 or selection_hr_violation or selection_finance_violation
falsepositives:
  - Misconfigured role assignment during user onboarding
level: medium
